name: Keep Render Awake

on:
  schedule:
    # Every 10 minutes (GitHub Actions cron is in UTC)
    - cron: '0/10 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render app
        run: |
          echo "=== Pinging at $(date) ==="
          for URL in "https://show.sohappyclaw.com/" "https://purapaw.onrender.com/"; do
            echo ""
            echo "Pinging: $URL"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$URL")
            echo "Response: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ $URL is alive"
            else
              echo "⚠️ $URL responded with $STATUS (may be waking up, will retry next cycle)"
            fi
          done
