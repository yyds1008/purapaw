<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#9B6BB4"/>
      <stop offset="100%" stop-color="#4A2C5A"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Large cat paw print - fills most of the icon -->
  <g fill="#F4C430">
    <!-- Main pad (big rounded shape) -->
    <ellipse cx="32" cy="40" rx="13" ry="11"/>
    <!-- Toe beans: 4 large ellipses across the top -->
    <ellipse cx="15" cy="28" rx="6" ry="7.5"/>
    <ellipse cx="26" cy="20" rx="6" ry="7.5"/>
    <ellipse cx="38" cy="20" rx="6" ry="7.5"/>
    <ellipse cx="49" cy="28" rx="6" ry="7.5"/>
  </g>

  <!-- Small green leaf accent (top right corner, tiny) -->
  <g fill="#7EC850" opacity="0.95">
    <ellipse cx="53" cy="9" rx="3.5" ry="2.5" transform="rotate(-30 53 9)"/>
    <line x1="53" y1="9" x2="56" y2="6" stroke="#5BA030" stroke-width="0.8" opacity="0.6"/>
  </g>
</svg>
